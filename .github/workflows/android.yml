# android/ 以下が変わったら、デバッグ版 APK をビルドし、
# リリース android-latest の APK を差し替える（Artifacts にも置く）
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# 続けて push したときは古いほうの実行を止める（古い APK でリリースを上書きしないように）
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # タグとリリースの更新に必要
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50  # 更新内容（直近のコミット）を version.json に書くため

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        # 失敗したら、コンパイルエラーの行を注釈（::error::）として出す（ログを開かなくても API から読めるように）

      - name: Report build errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: keiba-collector-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish to release android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk keiba-collector.apk
          # アプリの更新確認が読む版情報。versionCode / versionName は app/build.gradle.kts と同じ式
          git log -10 --date=format:%Y-%m-%d --format='%ad%x09%s' -- android .github/workflows/android.yml > changes.tsv
          python3 - <<'PY'
          import json, os, datetime
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          changes = []
          for line in open("changes.tsv", encoding="utf-8"):
              date, _, subject = line.rstrip("\n").partition("\t")
              changes.append({"date": date, "text": subject})
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          info = {"versionCode": 1000 + run, "versionName": f"0.4.{run}", "commit": os.environ["GITHUB_SHA"][:7],
                  "builtAt": now.strftime("%Y-%m-%d %H:%M"), "changes": changes}
          json.dump(info, open("version.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
          cat version.json
          # タグを今回のコミットに付け替える
          git tag -f android-latest
          git push -f origin refs/tags/android-latest
          notes="Android版 v0.4.${GITHUB_RUN_NUMBER}（コミット ${GITHUB_SHA::7}、$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST）。
          keiba-collector.apk をダウンロードしてインストールしてください。入れ方は android/README.md を参照。"
          if gh release view android-latest > /dev/null 2>&1; then
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest --title "Android版（最新）" --notes "$notes" --latest
          fi
          # APK を先に差し替えてから version.json を差し替える（新しい版の通知が出た時点で APK が新しくなっているように）
          gh release upload android-latest keiba-collector.apk --clobber
          gh release upload android-latest version.json --clobber
