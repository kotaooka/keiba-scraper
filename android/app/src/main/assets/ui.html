<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地方競馬データ収集</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>

<!-- ===== 一覧画面 ===== -->
<div id="home">
  <header class="appbar">
    <div class="appbar-row">
      <h1>地方競馬データ収集</h1>
      <button class="icon-btn labeled" id="themeBtn" aria-label="表示の切り替え"></button>
      <button class="icon-btn labeled has-dot" id="recordsTop" aria-label="予想の記録と答え合わせ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 12l2 2 4-4M8.5 17.5h7"/></svg>
        <span class="lb">記録</span>
        <span class="dot hidden" id="recDot"></span>
      </button>
      <button class="icon-btn labeled has-dot" id="prefsBtn" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        <span class="lb">設定</span>
        <span class="dot hidden" id="prefsDot"></span>
      </button>
    </div>
    <button class="update-bar hidden" id="updateBar"></button>
    <div class="datebar">
      <button class="step" id="prevDay" aria-label="前の日">‹</button>
      <label class="date">
        <span class="d num" id="dateText"></span><span class="w" id="weekText"></span><span class="tag" id="dateTag"></span>
        <input type="date" id="dateInput" aria-label="レース日">
      </label>
      <button class="step" id="nextDay" aria-label="次の日">›</button>
    </div>
    <nav class="venues" id="venues" role="tablist"></nav>
  </header>
  <main>
    <div class="ptr" id="ptr"><span id="ptrText"></span></div>
    <div id="raceArea"></div>
  </main>
</div>

<!-- ===== 収集中・結果の画面 ===== -->
<div id="detail" class="hidden">
  <header class="appbar">
    <div class="page-head">
      <button class="back" id="backBtn">‹ レース一覧</button>
    </div>
  </header>
  <main id="detailBody"></main>
</div>

<div class="scrim hidden" id="scrim"></div>
<div class="sheet-scrim hidden" id="sheetScrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>
<div class="preview-bar hidden" id="previewBar"><span>下半分にサイトのプレビューを表示中</span><button id="previewClose">閉じる</button></div>
<div class="toast" id="toast"></div>

<script src="scraper.js"></script>
<script src="js/ui-core.js"></script>
<script src="js/ui-result.js"></script>
<script src="js/ui-records.js"></script>
<script src="js/ui-settings.js"></script>
</body>
</html>
