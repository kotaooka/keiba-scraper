<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地方競馬データ収集</title>
<style>
/* 配色は地方競馬に寄せる（QC Workbench の DESIGN.md 1.4 に記載）。
   ライト＝昼の砂の馬場と内馬場の緑、ダーク＝ナイター（夜の砂と照明・電光掲示板の琥珀）。
   判定色（ok / warn / ng）は DESIGN.md の値のまま */
:root {
  --bg: #f2ebdf; --surface: #fffcf6; --ink: #2b2117; --ink2: #5e4f3f; --muted: #8b7b69;
  --line: #e2d6c3; --grid: #ece3d4;
  --accent: #1f5f3f; --accent-ink: #ffffff; --accent-weak: #e1eee5;
  --ok: #17703a; --ok-weak: #e2f2e7; --warn: #8a5300; --warn-weak: #f8ecd9; --ng: #ad2a22; --ng-weak: #f8e4e2;
  --shadow: 0 1px 2px rgba(60, 40, 20, .07), 0 2px 8px rgba(60, 40, 20, .05);
  --rail: #ffffff; --rail-post: #b9a98f;
  /* レース番号は電光掲示板ふう（ライト・ダーク共通） */
  --board: #17130f; --board-ink: #ffb43c;
  /* 端末に BIZ UDPGothic は無いので、外部から字体を読まずに端末の字体を使う */
  --f-ui: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Roboto Mono", "Droid Sans Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12100e; --surface: #1e1a16; --ink: #f1e9dc; --ink2: #c4b6a3; --muted: #8f8170;
    --line: #352d25; --grid: #2a241e;
    --accent: #f0a83a; --accent-ink: #1a1206; --accent-weak: #3b2b12;
    --ok: #57c483; --ok-weak: #163222; --warn: #e3a84e; --warn-weak: #36280f; --ng: #f07a70; --ng-weak: #3a1c1a;
    --shadow: none; --rail: #e9e2d4; --rail-post: #5a4e40; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12100e; --surface: #1e1a16; --ink: #f1e9dc; --ink2: #c4b6a3; --muted: #8f8170;
  --line: #352d25; --grid: #2a241e;
  --accent: #f0a83a; --accent-ink: #1a1206; --accent-weak: #3b2b12;
  --ok: #57c483; --ok-weak: #163222; --warn: #e3a84e; --warn-weak: #36280f; --ng: #f07a70; --ng-weak: #3a1c1a;
  --shadow: none; --rail: #e9e2d4; --rail-post: #5a4e40; color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55; }
body { text-autospace: normal; overscroll-behavior-y: contain; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.num { font-family: var(--f-num); font-weight: 500; font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ===== 上部の帯 ===== */
.appbar { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 12px 16px 0; }
#home .appbar::after { content: ""; display: block; height: 7px; margin: 0 -16px;
  background:
    linear-gradient(var(--rail), var(--rail)) 0 1px / 100% 3px no-repeat,
    repeating-linear-gradient(90deg, var(--rail-post) 0 2px, transparent 2px 28px) 0 4px / 100% 3px no-repeat; }
.appbar-row { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.appbar h1 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; letter-spacing: .02em; }
.appbar h1 small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--ink2); }
.icon-btn:active { background: var(--grid); }
.icon-btn svg { width: 22px; height: 22px; }

/* 日付 */
.datebar { display: flex; align-items: stretch; gap: 8px; margin-top: 10px; }
.datebar .step { width: 44px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink2); font-size: 20px; }
.datebar .date { flex: 1; position: relative; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 8px 14px; text-align: left; display: flex; align-items: center; gap: 10px; }
.datebar .date .d { font-size: 17px; font-weight: 700; }
.datebar .date .w { color: var(--ink2); font-size: 13px; }
.datebar .date .tag { white-space: nowrap; margin-left: auto; font-size: 12px; color: var(--accent); background: var(--accent-weak); padding: 2px 8px; border-radius: 10px; }
.datebar .date .tag.past { color: var(--muted); background: var(--grid); }
.datebar input[type=date] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; }
.datebar button:active { filter: brightness(.96); }

/* 競馬場のタブ */
.venues { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 12px; margin: 0 -16px; scrollbar-width: none; }
.venues::-webkit-scrollbar { display: none; }
.venue { flex: none; padding: 7px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; white-space: nowrap; }
.venue span { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
.venue[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.venue[aria-selected="true"] span { color: var(--accent-ink); opacity: .8; }

main { padding: 0 16px 32px; }

/* ===== レース一覧 ===== */
.races { display: grid; gap: 8px; }
.race { display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 12px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.race:active { background: var(--accent-weak); }
.race .no { font-family: var(--f-num); font-weight: 500; font-size: 21px; text-align: center; line-height: 1; padding: 9px 0 8px;
  background: var(--board); color: var(--board-ink); border-radius: 8px; text-shadow: 0 0 6px rgba(255, 170, 40, .55); }
.race .no small { font-size: 11px; margin-left: 1px; }
.race .no, .race-title .num { box-shadow: 0 0 0 1px rgba(255, 180, 60, .18) inset; }
.race.started .no { color: #9a8a74; text-shadow: none; }
.race .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.race .s { color: var(--ink2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 0 10px; }
.race .s span { white-space: nowrap; }
.race .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.race.started { opacity: .55; box-shadow: none; }
.race.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, var(--shadow); }
.badge { font-size: 11.5px; padding: 1px 8px; border-radius: 9px; white-space: nowrap; line-height: 1.6; }
.badge.next { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.badge.done { background: var(--ok-weak); color: var(--ok); }
.badge.ended { background: var(--grid); color: var(--muted); }
.chev { color: var(--muted); font-size: 18px; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 8px; }
.section-title h2 { margin: 0; font-size: 14px; color: var(--ink2); font-weight: 700; }
.section-title p { margin: 0; font-size: 12px; color: var(--muted); }

/* 読み込み中の骨組み */
.skel { height: 66px; border-radius: 14px; background: linear-gradient(90deg, var(--surface) 0%, var(--grid) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite; border: 1px solid var(--line); }
@keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.empty { text-align: center; color: var(--ink2); padding: 48px 16px; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }

/* ===== ボタン ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700; }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
.btn.quiet { color: var(--ink2); }
.btn.danger { color: var(--ng); background: var(--surface); border: 1px solid var(--line); }
.btn:active { filter: brightness(.94); }
.btn:disabled { opacity: .5; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ===== 収集中・結果の画面 ===== */
.page-head { display: flex; align-items: center; gap: 4px; margin: 0 -8px; }
.page-head .back { display: flex; align-items: center; gap: 2px; color: var(--accent); padding: 8px; border-radius: 10px; font-weight: 700; }
.page-head .back:active { background: var(--grid); }
.race-title { margin: 6px 0 2px; font-size: 21px; font-weight: 700; line-height: 1.35; }
.race-title .num { background: var(--board); color: var(--board-ink); padding: 0 8px; border-radius: 6px; font-size: .9em; text-shadow: 0 0 6px rgba(255, 170, 40, .55); }
.race-sub { color: var(--ink2); font-size: 13px; margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--ink2); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; margin-top: 12px; }
.card h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.card h3 .aside { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); }

/* 進捗 */
.bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin: 4px 0 2px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--grid); }
.steps li:first-child { border-top: 0; }
.steps .ic { width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; font-size: 13px; font-weight: 700; border: 1.5px solid var(--line); color: var(--muted); }
.steps li[data-s="run"] .ic { border-color: var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; }
.steps li[data-s="ok"] .ic { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.steps li[data-s="warn"] .ic { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.steps li[data-s="ng"] .ic { background: var(--ng); border-color: var(--ng); color: var(--surface); }
.steps li[data-s="skip"] .ic { border-style: dashed; }
.steps li[data-s="wait"] .name { color: var(--muted); }
.steps .name { font-weight: 700; font-size: 14px; }
.steps .name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.steps .det { color: var(--ink2); font-size: 13px; }
@keyframes spin { to { transform: rotate(360deg); } }
.preview-btn { width: 100%; margin-top: 12px; min-height: 42px; font-size: 14px; }
.note { font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }

details.log { margin-top: 12px; }
details.log summary { color: var(--ink2); font-size: 13px; padding: 6px 2px; }
details.log pre { margin: 6px 0 0; font-family: var(--f-num); font-size: 11.5px; white-space: pre-wrap; color: var(--ink2); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 40vh; overflow: auto; }

/* 結果 */
.warn-card { background: var(--warn-weak); border-color: transparent; box-shadow: none; }
.warn-card h3 { color: var(--warn); }
.warn-card ul { margin: 0; padding-left: 1.2em; font-size: 13px; color: var(--ink); }
.ok-card { background: var(--ok-weak); border-color: transparent; box-shadow: none; }
.ok-card h3 { color: var(--ok); margin: 0; }

.horses { display: grid; gap: 2px; }
.horse { display: grid; grid-template-columns: 28px 1fr 52px 48px 40px; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--grid); font-size: 14px; }
.horse:first-child { border-top: 0; }
.horse .n { width: 26px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-family: var(--f-num); font-size: 13px; border: 1px solid var(--line); }
.horse .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.horse .nm small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.horse .pb { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.horse .pb i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.horse .pr { text-align: right; font-family: var(--f-num); font-size: 13px; }
.horse .od { text-align: right; font-family: var(--f-num); font-size: 13px; color: var(--ink2); }
.horse.cancel { color: var(--muted); }
.horse.cancel .nm { text-decoration: line-through; }
/* 枠の色（JRA・NAR 共通の枠色） */
.w1 { background: #fff; color: #222; border-color: #bbb !important; } .w2 { background: #222; color: #fff; } .w3 { background: #d6301f; color: #fff; }
.w4 { background: #1f5fc4; color: #fff; } .w5 { background: #f2c818; color: #222; } .w6 { background: #2e8b3a; color: #fff; }
.w7 { background: #ee8a1c; color: #fff; } .w8 { background: #e86fa6; color: #fff; }
.legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }

details.preview summary { list-style: none; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
details.preview summary::-webkit-details-marker { display: none; }
details.preview summary::after { content: "›"; margin-left: auto; color: var(--muted); transform: rotate(90deg); transition: transform .2s; font-size: 18px; }
details.preview[open] summary::after { transform: rotate(-90deg); }
details.preview pre { margin: 10px -14px -14px; padding: 12px 14px; border-top: 1px solid var(--line); font-family: var(--f-num); font-size: 10.5px; line-height: 1.5; overflow-x: auto; white-space: pre; color: var(--ink); max-height: 60vh; }

.end-actions { display: grid; gap: 8px; margin-top: 16px; }
.sticky-actions { position: sticky; bottom: 0; background: linear-gradient(to bottom, transparent, var(--bg) 24%); padding: 20px 0 12px; margin-top: 4px; display: grid; gap: 8px; }

/* ===== 更新のお知らせ・このアプリについて ===== */
.update-bar { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 10px; padding: 9px 12px; border-radius: 12px;
  background: var(--accent-weak); color: var(--ink); text-align: left; font-size: 13.5px; }
.update-bar b { color: var(--accent); }
.update-bar .go { margin-left: auto; color: var(--accent); font-weight: 700; white-space: nowrap; }
.about-head { display: flex; align-items: center; gap: 14px; margin: 8px 0 4px; }
.about-head .logo { width: 56px; height: 56px; border-radius: 14px; background: #1f5f3f; display: grid; place-items: center; flex: none; }
.about-head h2 { margin: 0; font-size: 19px; }
.about-head p { margin: 2px 0 0; color: var(--ink2); font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.status { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.status .ic { width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; font-size: 14px; flex: none; }
.status.ok .ic { background: var(--ok); color: var(--surface); }
.status.new .ic { background: var(--accent); color: var(--accent-ink); }
.status.ng .ic { background: var(--ng); color: var(--surface); }
.status.run .ic { border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; }
.changes { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; }
.changes li { display: grid; grid-template-columns: 82px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--grid); }
.changes li span:first-child { color: var(--muted); font-family: var(--f-num); font-size: 12px; padding-top: 1px; }
.changes li.newer span:last-child { font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--grid); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { padding: 8px 0; border-radius: 8px; font-size: 14px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }

/* ===== 発走までの時間 ===== */
.until { color: var(--ink2); }
.until.soon { color: var(--accent); font-weight: 700; }
.time-line { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13.5px; margin: 0 0 10px; color: var(--ink2); }
.time-line b { color: var(--ink); }
.time-line .stale { color: var(--warn); font-weight: 700; }
.btn.stale { background: var(--warn-weak); color: var(--warn); border-color: transparent; }

/* 引っ張って更新 */
.ptr { height: 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; color: var(--muted); font-size: 13px; transition: height .2s; }
.ptr.dragging { transition: none; }
.ptr span { padding-bottom: 8px; }

/* お気に入りの競馬場 */
.venue .star { color: var(--accent); margin-right: 3px; font-weight: 700; }
.venue[aria-selected="true"] .star { color: var(--accent-ink); }

/* 結果画面の下に固定する送る操作 */
.send-bar { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: 1fr 64px 64px; gap: 8px;
  padding: 18px 0 12px; margin-top: 8px; background: linear-gradient(to bottom, transparent, var(--bg) 22%); }
.send-bar .btn { min-height: 52px; padding: 0 10px; }
.send-bar .sub { flex-direction: column; gap: 0; font-size: 11px; font-weight: 700; padding: 0; }
.send-bar .sub svg { width: 20px; height: 20px; margin-bottom: 1px; }
.send-bar .primary small { display: block; font-size: 11px; font-weight: 400; opacity: .85; }
.send-bar .primary .lbl { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }

/* 欠損の要約（たたむ） */
details.warn-card summary { list-style: none; display: flex; align-items: center; gap: 8px; color: var(--warn); font-weight: 700; font-size: 14px; }
details.warn-card summary::-webkit-details-marker { display: none; }
details.warn-card summary .first { color: var(--ink2); font-weight: 400; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
details.warn-card summary::after { content: "›"; color: var(--muted); transform: rotate(90deg); font-size: 16px; }
details.warn-card[open] summary::after { transform: rotate(-90deg); }
details.warn-card ul { margin-top: 8px; }

/* 各馬の詳細（行をタップで開く） */
.horse { cursor: pointer; }
.horse.open { background: var(--accent-weak); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
.hdetail { margin: 0 -14px; padding: 4px 14px 12px; background: var(--accent-weak); font-size: 12.5px; color: var(--ink2); }
.hdetail p { margin: 0 0 4px; }
.hdetail b { color: var(--ink); font-weight: 700; }
table.past { width: 100%; border-collapse: collapse; margin-top: 6px; font-family: var(--f-num); font-size: 11.5px; color: var(--ink); }
table.past th { font-family: var(--f-ui); font-weight: 400; color: var(--muted); font-size: 11px; text-align: right; padding: 2px 3px; border-bottom: 1px solid var(--line); }
table.past td { text-align: right; padding: 3px 3px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.past th:nth-child(-n+2), table.past td:nth-child(-n+2) { text-align: left; }
table.past td.win { color: var(--ok); font-weight: 700; }
table.past td.place { color: var(--accent); font-weight: 700; }
.seg.small { grid-template-columns: repeat(2, auto); padding: 2px; margin-left: auto; }
.seg.small button { padding: 3px 10px; font-size: 12px; }

/* 通知・自動収集の設定 */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-radius: 18px 18px 0 0; padding: 8px 16px 20px;
  box-shadow: 0 -8px 30px rgba(0,0,0,.25); max-height: 88vh; overflow-y: auto; }
.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 10px; }
.sheet h3 { margin: 0; font-size: 17px; }
.sheet .sub { color: var(--ink2); font-size: 13px; margin: 2px 0 12px; }
.sheet h4 { margin: 14px 0 6px; font-size: 13px; color: var(--ink2); }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--grid); font-size: 14.5px; }
.opt input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; flex: none; }
.opt .t { flex: 1; }

.send-bar.with-pat { grid-template-columns: 1fr 58px 58px 58px; }

.pat-line.none { color: var(--muted); }

/* 予想の記録と答え合わせ */
.rec-table { width: 100%; border-collapse: collapse; font-size: 13px; }

.rec-table td { padding: 6px 4px; border-bottom: 1px solid var(--grid); }

.rec-table .back { color: var(--warn); }

/* オッズの動き・注記・今日の収支・指示文 */

/* 予想の条件 */

.speed-table th { white-space: nowrap; }

<script src="scraper.js"></script>
<script>
"use strict";
// ===== 表示テーマ（自動・ライト・ダーク）=====
// 保存キーは QC Workbench の各ツールと同じ名前（DESIGN.md 1.5）。アプリ内だけに保存される
const THEME_KEY = "qc-workbench-theme";
const THEMES = ["auto", "light", "dark"];
const THEME_LABEL = { auto: "自動（端末に合わせる）", light: "ライト", dark: "ダーク" };
const THEME_ICON = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>',
};
let themePref = (() => { try { const t = localStorage.getItem(THEME_KEY); return THEMES.includes(t) ? t : "auto"; } catch (e) { return "auto"; } })();
let systemDark = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)").matches : false;
function applyTheme() {
  const dark = themePref === "auto" ? systemDark : themePref === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (window.Android && Android.setBarsDark) Android.setBarsDark(dark);
  const b = document.getElementById("themeBtn");
  if (b) { b.innerHTML = THEME_ICON[themePref]; b.setAttribute("aria-label", `表示：${THEME_LABEL[themePref]}`); }
  document.querySelectorAll("[data-theme-choice]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.themeChoice === themePref)));
}
function setThemePref(t) {
  themePref = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* 保存できなくても切り替えは効く */ }
  applyTheme();
}

// ===== Kotlin とのやり取り =====
// JS → Kotlin：window.Android（MainActivity の Bridge）
// Kotlin → JS：App.onRaceList / onStep / onLog / onResult / back / setTheme
const Native = window.Android || {
  // ブラウザで開いたとき用のダミー（画面の確認用）
  loadRaceList() {}, collect() {}, cancel() {}, copy() {}, share() {}, setDebug() {},
  setBarsDark() {}, checkUpdate() {}, installUpdate() {}, openUrl() {},
  appInfo() { return JSON.stringify({ versionCode: 1005, versionName: "0.4.5", commit: "abc1234", builtAt: "2026-10-26 12:30" }); },
  shareTarget() { return "Claude"; }, getReservations() { return "[]"; },
  setReservation(j) { return JSON.stringify({ ok: true, exact: false, notif: true }); }, removeReservation() {},
  takeBackgroundResults() { return "[]"; }, exactAlarmAllowed() { return false; }, openExactAlarmSettings() {},
  notificationsAllowed() { return true; }, requestNotifications() {},
  readClipboard() { return ""; }, fetchResults() {}, exportRecords() {}, importRecords() {}, scheduleResultCheck() { return "{}"; }, cancelResultCheck() {}, takeRaceResults() { return "[]"; }
};

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];

// 収集の段階（Scraper.kt の step キーと同じ）
const STEPS = [
  ["shutuba", "出馬表", "netkeiba"],
  ["keibago", "馬柱・過去5走", "keiba.go.jp"],
  ["tanfuku", "単勝・複勝オッズ", "netkeiba"],
  ["wide", "ワイドオッズ", "netkeiba"],
  ["sanren", "三連複オッズ", "netkeiba・上位人気一覧"],
  ["build", "テキストを作成", ""],
];

const state = {
  date: todayStr(), venues: null, venue: null, loading: false,
  screen: "home", job: null, debug: false,
  scrolled: false,      // 次のレースまで自動でスクロールしたか（読み込み・競馬場の切替ごとに1回だけ）
  result: null,         // 表示中の結果 {venue, race, res}
  sort: "no",           // 各馬の並び（no：馬番順、ninki：人気順）
  open: new Set(),      // 詳細を開いている馬番
};

// ===== 端末に残す設定（すべて try で包む。保存できなくても動く） =====
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できなくても動く */ } },
};
const FAV_KEY = "keiba-fav-venues", LAST_VENUE_KEY = "keiba-last-venue";
state.venue = store.get(LAST_VENUE_KEY, null);

// ===== 日付 =====
// 発走時刻は日本時間なので、端末を海外の時間帯にしていても日本時間で数える。
// jstNow() は「端末の時刻表示が日本時間になるようにずらした Date」（getHours などで日本時間が読める）
function jstShift() { return (540 + new Date().getTimezoneOffset()) * 60000; }
function jstNow() { return new Date(Date.now() + jstShift()); }
function jstOf(ms) { return new Date(ms + jstShift()); }
function todayStr() { return ymd(jstNow()); }
function ymd(d) { return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`; }
function parseYmd(s) { return new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6)); }
function shiftDate(days) { const d = parseYmd(state.date); d.setDate(d.getDate() + days); setDate(ymd(d)); }
function setDate(s) { state.date = s; renderDate(); loadRaceList(); }
function renderDate() {
  const d = parseYmd(state.date), t = todayStr();
  $("dateText").textContent = `${state.date.slice(0, 4)}/${state.date.slice(4, 6)}/${state.date.slice(6)}`;
  $("weekText").textContent = `（${WEEK[d.getDay()]}）`;
  const diff = Math.round((d - parseYmd(t)) / 86400000);
  const tag = $("dateTag");
  tag.textContent = diff === 0 ? "今日" : diff === -1 ? "昨日" : diff === 1 ? "明日" : diff < 0 ? `${-diff}日前` : `${diff}日後`;
  tag.className = "tag" + (diff < 0 ? " past" : "");
  $("dateInput").value = `${state.date.slice(0, 4)}-${state.date.slice(4, 6)}-${state.date.slice(6)}`;
}

// ===== 収集済みの記録（この端末だけに保存。同じレースを何度も取りに行かないため） =====
const CACHE_KEY = "keiba-results";
function readCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "{}") || {}; } catch (e) { return {}; } }
function writeCache(c) {
  // 新しい順に 40 件まで残す
  const keys = Object.keys(c).sort((a, b) => (c[b].at || "").localeCompare(c[a].at || "")).slice(0, 40);
  const out = {}; for (const k of keys) out[k] = c[k];
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(out)); } catch (e) { /* 保存できなくても動く */ }
}
const cacheKey = (date, venue, no) => `${date}|${venue}|${no}`;

// ===== 即PAT・A-PAT の発売カレンダー =====
// keiba.go.jp の月ごとのカレンダーを、開催一覧を読むときに一緒に読む（6時間以内に読んだ月は読み直さない）
const PAT_KEY = "keiba-pat-calendar";
const PAT_KIND = { apat: "即PAT・A-PAT", pat: "即PATのみ" };
const patMonthOf = (date) => date.slice(0, 6);
function patStore() { return store.get(PAT_KEY, {}); }
function needPat(month) { const c = patStore()[month]; return !c || Date.now() - c.at > 6 * 3600 * 1000; }
state.patFailed = {};  // 読めなかった月
function onPatCalendar(month, data) {
  if (data && data.days) {
    const all = patStore(); all[month] = { at: Date.now(), days: data.days };
    // 新しい3か月分だけ残す
    const keep = Object.keys(all).sort().slice(-3); const out = {}; for (const k of keep) out[k] = all[k];
    store.set(PAT_KEY, out); delete state.patFailed[month];
  } else state.patFailed[month] = true;
  renderVenues();
  if (state.screen === "home" && !state.loading) renderRaces();
  if (state.screen === "result" && state.result) renderResult();
}
// その日・その競馬場の発売状況。status：sold（発売あり）/ none（発売なし）/ unknown（カレンダー未取得）
function patInfo(date, venue) {
  const cal = patStore()[patMonthOf(date)];
  if (!cal) return { status: state.patFailed[patMonthOf(date)] ? "failed" : "unknown" };
  const day = cal.days[String(parseInt(date.slice(6), 10))];
  const v = day && day.venues[venue];
  if (!v) return { status: "none" };
  return { status: "sold", kind: day.kind, time: day.time, v };
}
// そのレースが即PAT で買えるか（true / false / null＝分からない）
function patRace(info, no) {
  if (info.status === "none") return false;
  if (info.status !== "sold") return null;
  if (info.v.all) return true;
  if (info.v.from == null) return null;
  return no >= info.v.from && no <= info.v.to;
}
// 即PAT・A-PAT で地方競馬を買う入口（地方競馬ネット投票）。レースを指定して開く方法は公開されていないので、入口を開くだけ
const PAT_URL = "https://n.ipat.jra.go.jp/";
function openPat() { Native.openUrl(PAT_URL); }
const patRangeText = (v) => (v.all ? "全R" : v.from != null ? `${v.from}〜${v.to}R` : v.text);

// ===== 開催一覧 =====
function loadRaceList() {
  state.loading = true; state.venues = null; state.scrolled = false; state.listStale = false; state.listDate = state.date;
  renderVenues(); renderRaces();
  const month = patMonthOf(state.date);
  Native.loadRaceList(state.date, needPat(month) ? month : "");
}

// お気に入りの競馬場を先頭に（お気に入りに入れた順）
function orderedVenues() {
  const fav = store.get(FAV_KEY, []);
  const rank = (n) => { const i = fav.indexOf(n); return i < 0 ? 1e3 : i; };
  return (state.venues || []).map((v, i) => [v, i]).sort((a, b) => rank(a[0].name) - rank(b[0].name) || a[1] - b[1]).map((x) => x[0]);
}
function toggleFav(name) {
  const fav = store.get(FAV_KEY, []);
  const i = fav.indexOf(name);
  if (i < 0) fav.push(name); else fav.splice(i, 1);
  store.set(FAV_KEY, fav);
  toast(i < 0 ? `★ ${name} をお気に入りにしました（先頭に表示）` : `${name} をお気に入りから外しました`);
  renderVenues();
}
function selectVenue(name) {
  state.venue = name; state.scrolled = false;
  store.set(LAST_VENUE_KEY, name);
  renderVenues(); renderRaces(); window.scrollTo({ top: 0 });
}

function renderVenues() {
  const nav = $("venues"); nav.replaceChildren();
  if (!state.venues) return;
  const fav = store.get(FAV_KEY, []);
  for (const v of orderedVenues()) {
    const b = el("button", "venue");
    if (fav.includes(v.name)) b.append(el("span", "star", "★"));
    b.append(document.createTextNode(v.name));
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(state.venue === v.name));
    b.append(el("span", null, `${v.races.length}R`));
    const pi = patInfo(state.date, v.name);
    if (pi.status === "sold") b.append(el("span", "pat", pi.v.all ? "PAT" : `PAT ${patRangeText(pi.v)}`));
    onPress(b, () => selectVenue(v.name), () => toggleFav(v.name));
    nav.append(b);
  }
}

// 発走までの分（レース日と "HH:MM" から。発走時刻が無ければ null）
function untilMin(date, time) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(time || "");
  if (!m) return null;
  const d = parseYmd(date); d.setHours(+m[1], +m[2], 0, 0);
  return (d - jstNow()) / 60000;
}
function fmtUntil(min) {
  if (min == null) return "";
  if (min <= 0) return "発走済み";
  const m = Math.ceil(min);
  return m < 60 ? `あと${m}分` : `あと${Math.floor(m / 60)}時間${m % 60 ? `${m % 60}分` : ""}`;
}
// "YYYY-MM-DD HH:MM" を何分前か
function agoMin(at) { const d = new Date((at || "").replace(" ", "T")); return isNaN(d) ? null : (jstNow() - d) / 60000; }

// 長押しの判定（0.5秒）。長押しのあとの click は捨てる
function onPress(node, onTap, onLong) {
  let timer = null, long = false, sx = 0, sy = 0;
  const clear = () => { clearTimeout(timer); timer = null; };
  node.addEventListener("pointerdown", (e) => { long = false; sx = e.clientX; sy = e.clientY; clear(); timer = setTimeout(() => { long = true; onLong(); }, 500); });
  node.addEventListener("pointermove", (e) => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) clear(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach((t) => node.addEventListener(t, clear));
  node.addEventListener("contextmenu", (e) => e.preventDefault());
  node.addEventListener("click", (e) => { if (long) { e.preventDefault(); long = false; return; } onTap(e); });
}

function minutesOf(t) { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; }

function renderRaces() {
  const area = $("raceArea"); area.replaceChildren();
  if (state.loading) {
    const list = el("div", "races");
    for (let i = 0; i < 6; i++) list.append(el("div", "skel"));
    area.append(list);
    return;
  }
  if (!state.venues || !state.venues.length) {
    const e = el("div", "empty");
    e.append(el("b", null, state.venues ? "この日の開催はありません" : "開催一覧を読み込めませんでした"));
    e.append(el("span", null, state.venues ? "日付を変えてください" : "通信状態を確認して、もう一度読み込んでください"));
    const retry = el("button", "btn secondary", "もう一度読み込む"); retry.onclick = loadRaceList;
    e.append(el("br")); e.append(retry);
    area.append(e);
    return;
  }
  const v = state.venues.find((x) => x.name === state.venue) || state.venues[0];
  state.venue = v.name;
  const isToday = state.date === todayStr();
  const now = jstNow(), nowMin = now.getHours() * 60 + now.getMinutes();
  let nextIdx = -1;
  if (isToday) nextIdx = v.races.findIndex((r) => { const m = minutesOf(r.time); return m != null && m > nowMin; });
  const cache = readCache();

  const head = el("div", "section-title");
  head.append(el("h2", null, `${v.name}　${v.races.length}レース`));
  head.append(el("p", null, "タップで収集・長押しで通知・自動収集"));
  area.append(head);
  const pnl = dayPnl(state.date);
  if (pnl) {
    const b = el("button", "day-pnl");
    b.append(el("span", null, state.date === todayStr() ? "今日" : "この日"), el("span", null, `記録 ${pnl.n}件・結果 ${pnl.settled}件`));
    const sign = (x) => `${x >= 0 ? "+" : ""}${yen(x)}`;
    // 自分の馬券を入れた日は、自分の収支を先に出す（AI の買い目どおりの場合はその後ろに小さく）
    if (pnl.oSettled) b.append(el("b", pnl.od >= 0 ? "up" : "down", `自分 ${sign(pnl.od)}`));
    if (pnl.oSettled && (pnl.evSettled || pnl.hSettled)) {
      const ai = el("span", "ai-pnl");
      if (pnl.evSettled) ai.append(document.createTextNode(`${pnl.hSettled ? "AI期待値" : "AI"} ${sign(pnl.d)}`));
      if (pnl.hSettled) ai.append(document.createTextNode(`${pnl.evSettled ? "・" : ""}AI的中 ${sign(pnl.hd)}`));
      b.append(ai);
    } else if (pnl.evSettled && pnl.hSettled) {
      b.append(el("b", pnl.d >= 0 ? "up" : "down", `期待値重視 ${sign(pnl.d)}`), el("b", pnl.hd >= 0 ? "up" : "down", `的中重視 ${sign(pnl.hd)}`));
    } else if (pnl.evSettled) b.append(el("b", pnl.d >= 0 ? "up" : "down", sign(pnl.d)));
    else if (pnl.hSettled) b.append(el("b", pnl.hd >= 0 ? "up" : "down", `的中重視 ${sign(pnl.hd)}`));
    b.append(el("span", "go", "記録 ›"));
    b.onclick = showRecords;
    area.append(b);
  }
  const pi = patInfo(state.date, v.name);
  if (pi.status === "sold") {
    const pl = el("p", "pat-line");
    pl.append(el("b", null, `${PAT_KIND[pi.kind]}で発売`), el("span", null, `${patRangeText(pi.v)}${pi.time ? `・${pi.time}` : ""}`));
    const op = el("button", "open", "即PATを開く ›"); op.onclick = openPat; pl.append(op);
    area.append(pl);
  } else if (pi.status === "none") {
    area.append(el("p", "pat-line none", `この日の${v.name}は、即PAT・A-PAT での発売はありません`));
  } else if (pi.status === "failed") {
    area.append(el("p", "pat-line none", "即PAT・A-PAT の発売カレンダーを読めませんでした（引っ張って読み直せます）"));
  }

  const list = el("div", "races");
  v.races.forEach((r, i) => {
    const b = el("button", "race");
    const started = isToday && minutesOf(r.time) != null && minutesOf(r.time) <= nowMin;
    if (started) b.classList.add("started");
    if (i === nextIdx) b.classList.add("next");
    const no = el("div", "no", String(r.no)); no.append(el("small", null, "R"));
    const mid = el("div");
    mid.append(el("div", "t", r.title || `${r.no}R`));
    const s = el("div", "s");
    s.append(el("span", "num", r.time || "--:--"));
    if (r.heads) s.append(el("span", null, `${r.heads}頭`));
    const um = isToday ? untilMin(state.date, r.time) : null;
    if (um != null && um > 0) s.append(el("span", "until" + (um <= 30 ? " soon" : ""), fmtUntil(um)));
    mid.append(s);
    const badges = el("div", "badges");
    const c = cache[cacheKey(state.date, v.name, r.no)];
    if (i === nextIdx) badges.append(el("span", "badge next", "次"));
    else if (started) badges.append(el("span", "badge ended", "発走済み"));
    if (c) badges.append(el("span", "badge done", `✓ 収集済み ${c.at.slice(11, 16)}`));
    const onPat = patRace(pi, r.no);
    if (onPat === true) badges.append(el("span", "badge pat", "即PAT"));
    else if (onPat === false && pi.status === "sold") badges.append(el("span", "badge nopat", "即PAT対象外"));
    const rv = reservations[cacheKey(state.date, v.name, r.no)];
    if (rv) badges.append(el("span", "badge alarm", rv.auto ? `⏰ 自動収集 ${hhmm(rv.start - rv.auto * 60000)}` : "⏰ 通知"));
    if (!badges.childElementCount) badges.append(el("span", "chev", "›"));
    b.append(no, mid, badges);
    onPress(b, () => (c ? showResult(v.name, r, c) : startCollect(v.name, r)), () => openReserve(v.name, r));
    list.append(b);
  });
  area.append(list);
  if (nextIdx > 2 && !state.scrolled) requestAnimationFrame(() => {
    state.scrolled = true;
    // 次のレースの1つ前が上の帯のすぐ下に来るようにする
    const target = list.children[nextIdx - 1];
    const header = document.querySelector("#home .appbar");
    window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - header.offsetHeight - 8 });
  });
}

// ===== 収集 =====
function raceHead(venue, race) {
  const frag = document.createDocumentFragment();
  const h = el("h2", "race-title");
  h.append(document.createTextNode(`${venue} `));
  h.append(el("span", "num", `${race.no}R`));
  if (race.title) h.append(document.createTextNode(` ${race.title}`));
  frag.append(h);
  const d = parseYmd(state.date);
  frag.append(el("p", "race-sub", `${state.date.slice(0, 4)}/${state.date.slice(4, 6)}/${state.date.slice(6)}（${WEEK[d.getDay()]}）` +
    (race.time ? `　${race.time} 発走` : "") + (race.heads ? `　${race.heads}頭` : "")));
  return frag;
}

function showScreen(name) {
  state.screen = name;
  $("home").classList.toggle("hidden", name !== "home");
  $("backBtn").textContent = name === "settings" && state.back === "result" ? "‹ 結果に戻る"
    : name === "result" && state.fromRecords ? "‹ 記録に戻る"
    : state.parent === "prefs" && ["settings", "records", "about"].includes(name) ? "‹ 設定" : "‹ レース一覧";
  $("detail").classList.toggle("hidden", name === "home");
  window.scrollTo({ top: 0 });
}

function startCollect(venue, race) {
  // 一覧の読み込み中に収集を始めると、Kotlin 側で一覧の読み込みが止まる。一覧に戻ったときに読み直す
  if (state.loading) state.listStale = true;
  state.job = { venue, race, steps: {}, log: [] };
  showScreen("collect");
  const body = $("detailBody"); body.replaceChildren();
  body.append(raceHead(venue, race));

  const card = el("div", "card");
  const h = el("h3", null, "収集中");
  const pct = el("span", "aside num", "0 / " + STEPS.length); pct.id = "stepCount";
  h.append(pct); card.append(h);
  const bar = el("div", "bar"); const fill = el("i"); fill.id = "barFill"; bar.append(fill); card.append(bar);
  const ul = el("ul", "steps"); ul.id = "steps";
  for (const [key, name, sub] of STEPS) {
    const li = el("li"); li.dataset.key = key; li.dataset.s = "wait";
    li.append(el("span", "ic"));
    const n = el("span", "name", name); if (sub) n.append(el("small", null, sub)); li.append(n);
    li.append(el("span", "det num"));
    ul.append(li);
  }
  card.append(ul);
  body.append(card);
  body.append(el("p", "note", "サイトに負荷をかけないよう、アクセスごとに2秒あけています。1レースで30秒〜1分ほどかかります"));
  const pv = el("button", "btn secondary preview-btn"); pv.id = "previewBtn"; pv.onclick = togglePreview;
  body.append(pv); renderPreviewBtn();

  const log = el("details", "log");
  log.append(el("summary", null, "詳細ログ"));
  const pre = el("pre"); pre.id = "logPre"; log.append(pre);
  body.append(log);

  const actions = el("div", "sticky-actions");
  const cancel = el("button", "btn danger", "中止する");
  cancel.onclick = () => { Native.cancel(); };
  actions.append(cancel);
  body.append(actions);

  Native.collect(venue, state.date, race.no);
}

function setStep(key, s, detail) {
  if (!state.job) return;
  state.job.steps[key] = s;
  const li = document.querySelector(`#steps li[data-key="${key}"]`);
  if (li) {
    li.dataset.s = s;
    li.querySelector(".ic").textContent = { ok: "✓", warn: "!", ng: "×", skip: "–" }[s] || "";
    if (detail != null) li.querySelector(".det").textContent = detail;
  }
  const done = Object.values(state.job.steps).filter((v) => v !== "run").length;
  const fill = $("barFill"); if (fill) fill.style.width = `${Math.round(done / STEPS.length * 100)}%`;
  const cnt = $("stepCount"); if (cnt) cnt.textContent = `${done} / ${STEPS.length}`;
}

function addLog(line) {
  if (!state.job) return;
  state.job.log.push(line);
  const pre = $("logPre"); if (pre) { pre.textContent += (pre.textContent ? "\n" : "") + line; pre.scrollTop = pre.scrollHeight; }
}

function renderResult() {
  const { venue, race, res, fresh } = state.result;
  const body = $("detailBody"); body.replaceChildren();
  const info = res.info;
  const r = { ...race, title: info.race_name || race.title, time: info.start || race.time, heads: info.heads || race.heads };
  body.append(raceHead(venue, r));

  const chips = el("div", "chips");
  for (const c of [info.course, info.cond && `馬場 ${info.cond}`, info.cls]) if (c) chips.append(el("span", "chip", c));
  const pi = patInfo(state.date, venue), onPat = patRace(pi, +race.no);
  if (onPat === true) chips.append(el("span", "chip pat", `${PAT_KIND[pi.kind]}で発売`));
  else if (onPat === false) chips.append(el("span", "chip", "即PAT・A-PAT は発売なし"));
  body.append(chips);

  // 発走までの時間と、オッズを取ってからの時間
  const tl = el("p", "time-line"); tl.id = "timeLine"; body.append(tl);
  const row = el("div", "btn-row");
  const again = el("button", "btn secondary"); again.id = "againBtn";
  again.onclick = () => startCollect(venue, race);
  const alarm = el("button", "btn secondary", "⏰ 通知・自動収集");
  alarm.onclick = () => openReserve(venue, r);
  row.append(again, alarm);
  body.append(row);
  updateTimeLine();
  const cond = el("button", "cond-line");
  cond.append(el("span", null, "AI への条件"), el("b", null, betSummary(betSettings()) + (promptTemplate() ? "・指示文は書き換え中" : "")), el("span", "go", "変更 ›"));
  cond.onclick = () => { state.back = "result"; showSettings(); };
  body.append(cond);

  // オッズの動き（取り直したとき）
  if (res.info.predicted) {
    const pc = el("div", "card warn-card");
    pc.append(el("h3", null, "発売前：単勝は予想オッズです"));
    pc.append(el("p", null, "netkeiba の AI が戦績から出した予想で、実際の投票ではありません。市場勝率・期待値は参考値です。発売が始まったら「オッズを更新」で取り直してください（複勝・ワイド・三連複のオッズも発売後に取れます）"));
    body.append(pc);
  }
  if (res.diff) {
    const dc = el("div", "card diff-card");
    dc.append(el("h3", null, `前回（${res.diff.prevAt}）からの変化`));
    if (!res.diff.items.length) dc.append(el("p", "note", "単勝10%以上の動き・取消・騎手変更・馬体重の発表はありません"));
    else {
      const ul = el("ul", "diff-list");
      for (const it of res.diff.items) {
        const li = el("li"); li.append(el("b", null, `${it.no} ${it.name}　`));
        it.changes.forEach((c, i) => { if (i) li.append(document.createTextNode("／")); li.append(el("span", c.kind === "odds" ? (c.down ? "dn" : "upc") : null, c.text)); });
        ul.append(li);
      }
      dc.append(ul);
      dc.append(el("p", "note", "↓は売れて下がった、↑は上がった。この変化は AI へ送るテキストにも入ります"));
    }
    body.append(dc);
  }
  // オッズの注記（複勝の大口投票の疑い）
  if (info.odds_notes && info.odds_notes.length) {
    const nc = el("div", "card note-card"); nc.append(el("h3", null, "オッズの注記"));
    const ul = el("ul"); for (const n of info.odds_notes) ul.append(el("li", null, n)); nc.append(ul);
    nc.append(el("p", "note", "AI へ送るテキストにも入っています"));
    body.append(nc);
  }

  // 欠損（1行に畳む）
  if (info.warnings.length) {
    const w = el("details", "card warn-card");
    const sm = el("summary");
    sm.append(el("span", null, `! 欠損 ${info.warnings.length}件`), el("span", "first", info.warnings[0]));
    w.append(sm);
    const ul = el("ul"); for (const x of info.warnings) ul.append(el("li", null, x)); w.append(ul);
    w.append(el("p", "note", "欠損は AI への指示で「推測で補わず市場評価に寄せる」ように伝えています"));
    body.append(w);
  } else {
    const ok = el("div", "card ok-card"); ok.append(el("h3", null, "✓ 欠損なし")); body.append(ok);
  }

  // 各馬
  const hc = el("div", "card");
  const hh = el("h3", null, "各馬");
  if (info.payout_rate) hh.append(el("span", "aside num", `払戻率 ${(info.payout_rate * 100).toFixed(1)}%`));
  const seg = el("div", "seg small");
  for (const [k, label] of [["no", "馬番順"], ["ninki", "人気順"]]) {
    const b = el("button", null, label); b.setAttribute("aria-pressed", String(state.sort === k));
    b.onclick = () => { state.sort = k; renderResult(); };
    seg.append(b);
  }
  hh.append(seg);
  hc.append(hh);
  const list = el("div", "horses");
  const maxP = Math.max(...info.horses.map((h) => h.prob || 0), 1);
  const horses = info.horses.slice();
  if (state.sort === "ninki") horses.sort((a, b) => (a.cancel - b.cancel) || ((b.prob ?? -1) - (a.prob ?? -1)) || (+a.no - +b.no));
  for (const h of horses) {
    const rw = el("div", "horse" + (h.cancel ? " cancel" : "") + (state.open.has(h.no) ? " open" : ""));
    rw.append(el("span", "n" + (h.waku ? ` w${h.waku}` : ""), h.no));
    const nm = el("span", "nm", h.name); if (h.jockey) nm.append(el("small", null, h.jockey)); rw.append(nm);
    const pb = el("span", "pb");
    if (!h.cancel) { const i = el("i"); i.style.width = `${(h.prob || 0) / maxP * 100}%`; pb.append(i); }
    rw.append(pb);
    rw.append(el("span", "pr", h.cancel ? "取消" : h.prob != null ? `${h.prob.toFixed(1)}%` : "--"));
    rw.append(el("span", "od", h.cancel ? "" : h.odds));
    rw.onclick = () => { state.open.has(h.no) ? state.open.delete(h.no) : state.open.add(h.no); renderResult(); };
    list.append(rw);
    if (state.open.has(h.no)) list.append(horseDetail(h));
  }
  hc.append(list);
  const lg = el("div", "legend");
  lg.append(el("span", null, "行をタップで過去5走"));
  lg.append(el("span", null, "市場勝率・単勝"));
  hc.append(lg);
  body.append(hc);

  // 同条件の走破タイム（過去5走のうち、今回と同じ競馬場・同じ距離のレースの最速）
  const sp = res.info.speed;
  if (sp && sp.rows && sp.rows.length) {
    const sc = el("div", "card");
    const sh = el("h3", null, "走破タイム"); sh.append(el("span", "aside", sp["条件"])); sc.append(sh);
    const tb = el("table", "rec-table speed-table");
    const hr = el("tr"); for (const [t, cls] of [["馬"], ["タイム", "r"], ["差", "r"], ["馬場"], ["上がり", "r"]]) hr.append(el("th", cls || null, t)); tb.append(hr);
    const top = sp.rows[0].sec;
    sp.rows.forEach((x, i) => {
      const tr = el("tr");
      tr.append(el("td", null, `${x["馬番"]} ${x["馬名"]}`), el("td", "r t", x.time),
        el("td", "r num", i === 0 ? "最速" : `+${(x.sec - top).toFixed(1)}`), el("td", null, x["馬場"] || "--"),
        el("td", "r num", x["上がり"] != null ? x["上がり"].toFixed(1) : "--"));
      tb.append(tr);
    });
    sc.append(tb);
    const nt = [`過去5走のうち、今回と同じ競馬場・同じ距離（${sp["条件"]}）のレースの最速タイム。条件の違うレースのタイムは比べられないので入れていません。馬場状態で速さが変わるので、馬場も見てください`];
    if (sp.none && sp.none.length) nt.unshift(`同条件の走歴なし：${sp.none.join("・")}番`);
    for (const t of nt) sc.append(el("p", "note", t));
    body.append(sc);
  }

  // AI の予想（記録と答え合わせ）
  body.append(aiCard(venue, race));
  body.append(ownCard(venue, race));

  // テキスト
  const pc = el("details", "card preview");
  const sendText = textFor(res);
  pc.append(el("summary", null, `送るテキストを見る（${sendText.split("\n").length}行）`));
  pc.append(el("pre", null, sendText));
  body.append(pc);
  body.append(el("p", "note", `ワイド上位 ${info.wide}組・三連複上位 ${info.sanren}組も送ります。収集 ${res.at}` + (fresh ? "（テキストはコピー済み）" : "")));

  // 送る（画面の下に固定）
  const bar = el("div", "send-bar");
  const send = el("button", "btn primary");
  send.innerHTML = ICON_SEND;
  const target = shareLabel();
  const lbl = el("span", "lbl", target ? `${target} へ送る` : "AIアプリへ送る");
  lbl.append(el("small", null, target ? "長押しで変更" : "送り先を選ぶ"));
  send.append(lbl);
  onPress(send, () => Native.share(textFor(res), false), () => Native.share(textFor(res), true));
  const copy = el("button", "btn secondary sub"); copy.innerHTML = ICON_COPY; copy.append(document.createTextNode("コピー"));
  copy.onclick = () => { Native.copy(textFor(res)); toast("コピーしました"); };
  const pick = el("button", "btn secondary sub"); pick.innerHTML = ICON_PICK; pick.append(document.createTextNode("送り先"));
  pick.onclick = () => Native.share(textFor(res), true);
  bar.append(send, copy, pick);
  // そのレースを即PAT・A-PAT で売っているときだけ、投票の入口を開くボタンを出す
  if (patRace(patInfo(state.date, venue), +race.no) === true) {
    const pat = el("button", "btn secondary sub");
    pat.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 12h8M13 9l3 3-3 3"/></svg>';
    pat.append(document.createTextNode("即PAT"));
    pat.setAttribute("aria-label", "即PAT（地方競馬ネット投票）を開く");
    pat.onclick = openPat;
    bar.classList.add("with-pat");
    bar.append(pat);
  }
  body.append(bar);
}

// 発走まで・取得から何分かを30秒ごとに書き直す。取得から10分以上たっていたら「オッズを更新」を目立たせる
function updateTimeLine() {
  if (state.screen !== "result" || !state.result) return;
  const { race, res } = state.result;
  const tl = $("timeLine"), again = $("againBtn");
  if (!tl || !again) return;
  const um = untilMin(state.date, res.info.start || race.time);
  const ago = agoMin(res.at);
  tl.replaceChildren();
  if (um != null) {
    const a = el("span"); a.append(document.createTextNode(um > 0 ? "発走まで " : ""), el("b", null, um > 0 ? fmtUntil(um).replace("あと", "") : "発走済み"));
    tl.append(a);
  }
  // 発走まで90分を切ってから、取って10分以上たったオッズを目立たせる（前日や朝のうちは更新しても変わりにくい）
  const stale = um != null && um > 0 && um <= 90 && ago != null && ago >= 10;
  const agoText = ago < 1 ? "1分以内" : ago < 60 ? `${Math.floor(ago)}分前` : `${Math.floor(ago / 60)}時間${Math.floor(ago % 60)}分前`;
  if (ago != null) tl.append(el("span", stale ? "stale" : null, `オッズは${agoText}に取得`));
  again.className = "btn " + (stale ? "stale" : "secondary");
  // 古いことは上の行（オッズは○分前に取得）と色で伝え、ボタンの文言は短く保つ
  again.textContent = um != null && um <= 0 ? "取り直す" : stale ? "! オッズを更新" : "オッズを更新";
}

function horseDetail(h) {
  const d = el("div", "hdetail");
  const a = [h.sex_age, h.kinryo && `斤量 ${h.kinryo}${h.kinryo_diff ? `（前走比 ${h.kinryo_diff}）` : ""}`,
    h.weight && `馬体重 ${h.weight}`, h.kyaku && `脚質 ${h.kyaku}`, h.interval && `前走から ${h.interval}`, h.norikae && `乗替 ${h.norikae}`].filter(Boolean);
  if (a.length) d.append(el("p", null, a.join("・")));
  const condText = Object.entries(h.cond || {}).map(([k, v]) => `${k}${v}`).join(" ");
  const b = [condText && `成績 ${condText}`, h.mochi && `持ち時計 ${h.mochi}`, h.combo && `騎手コンビ ${h.combo}`, h.ninki && `${h.ninki}番人気`, h.fuku && h.fuku !== "--" && `複勝 ${h.fuku}`].filter(Boolean);
  if (b.length) d.append(el("p", null, b.join("｜")));
  if (!h.past || !h.past.length) { d.append(el("p", null, "過去成績を取得できませんでした")); return d; }
  const t = el("table", "past");
  const tr0 = el("tr"); for (const x of ["日付", "場", "距離", "馬場", "人", "着/頭", "差", "上り"]) tr0.append(el("th", null, x)); t.append(tr0);
  for (const p of h.past) {
    const tr = el("tr");
    const rank = /^\d+$/.test(p.rank) ? +p.rank : null;
    const cells = [p.date, p.venue, p.dist, p.baba, p.ninki, `${p.rank}${p.heads ? `/${p.heads}` : ""}`, p.diff, p.agari];
    cells.forEach((v, i) => { const td = el("td", i === 5 && rank != null ? (rank === 1 ? "win" : rank <= 3 ? "place" : null) : null, v || ""); tr.append(td); });
    t.append(tr);
  }
  d.append(t);
  return d;
}

// ===== Kotlin から呼ばれる =====
const App = {
  onRaceList(list) {
    state.loading = false;
    if (!state.listDate) state.listDate = state.date;
    state.venues = list;
    if (list && !list.some((v) => v.name === state.venue)) {
      const saved = store.get(LAST_VENUE_KEY, null);
      state.venue = list.some((v) => v.name === saved) ? saved : (orderedVenues()[0] || {}).name || null;
    }
    renderVenues(); renderRaces();
  },
  onStep(key, s, detail) { setStep(key, s, detail); },
  onLog(line) { addLog(line); },
  onResult(res, error) {
    const job = state.job;
    if (!job || state.screen !== "collect") return;
    if (!res) {
      // 失敗・中止：進捗画面のまま、理由と戻る操作を出す
      const body = $("detailBody");
      const act = body.querySelector(".sticky-actions"); if (act) act.remove();
      const card = el("div", "card warn-card");
      card.append(el("h3", null, error === "cancel" ? "中止しました" : "× 収集できませんでした"));
      if (error && error !== "cancel") card.append(el("p", "note", error));
      body.append(card);
      const a = el("div", "end-actions");
      const retry = el("button", "btn primary", "もう一度収集する"); retry.onclick = () => startCollect(job.venue, job.race);
      const back = el("button", "btn quiet", "レース一覧に戻る"); back.onclick = goHome;
      a.append(retry, back); body.append(a);
      return;
    }
    setPreview(false);
    const at = res.at;
    const c = readCache(); const ck = cacheKey(state.date, job.venue, job.race.no);
    // 同じレースを取り直したときは、前回の収集と比べたオッズの動きを残す
    const prev = c[ck];
    if (prev && prev.info) res.diff = { prevAt: prev.at.slice(11, 16), items: KS.diffRaces(prev.info, res.info) };
    c[ck] = { at, text: res.text, info: res.info, diff: res.diff || null }; writeCache(c);
    Native.copy(textFor(res));
    showResult(job.venue, job.race, { at, text: res.text, info: res.info, diff: res.diff || null }, true);
  },
  // 戻るボタン：一覧以外なら一覧へ戻して true、一覧なら false（アプリを閉じる）
  back() {
    if (!$("sheet").classList.contains("hidden")) { closeSheet(); return true; }
    if (state.debug) { setPreview(false); return true; }
    if (state.screen === "home") return false;
    if (state.screen === "settings" && state.back === "result" && state.result) { state.back = null; showScreen("result"); renderResult(); return true; }
    if (state.screen === "result" && state.fromRecords) { state.fromRecords = false; showRecords(); return true; }
    // 設定の画面から開いた画面は、設定へ戻る
    if (state.parent === "prefs" && ["settings", "records", "about"].includes(state.screen)) { showScreen("prefs"); renderPrefs(); return true; }
    if (state.screen === "collect" && state.job) { Native.cancel(); }
    goHome(); return true;
  },
  setTheme(t) { App.setSystemDark(t === "dark"); },
  // 端末のダークモードの状態（Kotlin から起動時と切り替え時に届く）
  setSystemDark(d) { systemDark = !!d; applyTheme(); },
  onUpdateInfo(latest, error) { onUpdateInfo(latest, error); },
  openFromNotification(p) { openFromNotification(p); },
  onPatCalendar(month, data) { onPatCalendar(month, data); },
  onRaceResult(raceId, res) { onRaceResult(raceId, res); },
  onResultsDone(err) { onResultsDone(err); },
  // 読み込んだファイルの中身（書き出しと同じ JSON。配列か {records: [...]}）を記録へ足す
  onImported(text, err) {
    if (text == null) { toast(err ? `読み込めませんでした（${err}）` : "読み込みを取りやめました"); return; }
    let items;
    try { items = JSON.parse(text); } catch (e) { toast("JSON として読めませんでした"); return; }
    items = Array.isArray(items) ? items : items && Array.isArray(items.records) ? items.records : [];
    const recs = readRecords();
    let added = 0, merged = 0, skipped = 0;
    for (const r of items) {
      if (!validRecord(r)) { skipped++; continue; }
      const k = cacheKey(r["日付"], r["競馬場"], r["レース番号"]);
      const cur = recs[k];
      if (!cur) { recs[k] = r; added++; continue; }
      let ch = false;
      if (!cur["AI"] && r["AI"]) {
        cur["AI"] = r["AI"]; ch = true;
        for (const f of ["買い方", "EV_MIN", "HIT_MIN", "HIT_EV_MIN", "予算", "予想オッズ"]) if (r[f] != null) cur[f] = r[f];
      }
      if (!cur["結果"] && r["結果"]) { cur["結果"] = r["結果"]; ch = true; }
      if (!ownBetsOf(cur).length && ownBetsOf(r).length) { cur["購入"] = r["購入"]; cur["購入時刻"] = r["購入時刻"]; ch = true; }
      if (ch) merged++;
    }
    writeRecords(recs); updateRecBadge();
    const dropped = Object.keys(recs).length - Object.keys(readRecords()).length;
    toast(`読み込みました（新しい記録 ${added}件・足した記録 ${merged}件` + (skipped ? `・形式が違って読めない記録 ${skipped}件` : "") +
      (dropped > 0 ? `。500件を超えた古い記録 ${dropped}件は残せませんでした` : "") + "）");
    if (state.screen === "records") renderRecords();
  },
  onExported(ok, err) { toast(ok ? "書き出しました" : err ? `書き出せませんでした（${err}）` : "書き出しを取りやめました"); },
  // アプリに戻ってきたとき：自動収集の結果・予約・送り先を読み直す
  onResume() {
    followToday();
    mergeBackgroundResults(); mergeRaceResults(); loadReservations(); updateRecBadge();
    if (state.screen === "home" && !state.loading) renderRaces();
    if (state.screen === "result" && state.result) renderResult();
    if (state.screen === "records" && !state.fetching) renderRecords();
    if (state.screen === "prefs") renderPrefs();
  },
  onUpdateState(s, detail) { onUpdateState(s, detail); },
};
window.App = App;

// ===== 版情報と更新 =====
const UPDATE_KEY = "keiba-update";  // 最後に確認した結果（{at, latest}）
const current = (() => { try { return JSON.parse(Native.appInfo()); } catch (e) { return { versionCode: 0, versionName: "?", commit: "", builtAt: "" }; } })();
const upd = { checking: false, latest: null, error: null, at: null, state: null, detail: "" };
(() => { try { const c = JSON.parse(localStorage.getItem(UPDATE_KEY) || "null"); if (c) { upd.latest = c.latest; upd.at = c.at; } } catch (e) {} })();
const hasUpdate = () => !!(upd.latest && upd.latest.versionCode > current.versionCode);

function checkUpdate() {
  upd.checking = true; upd.error = null;
  renderUpdateUi();
  Native.checkUpdate();
}
function onUpdateInfo(latest, error) {
  upd.checking = false;
  if (latest) {
    upd.latest = latest; upd.at = new Date().toISOString(); upd.error = null;
    try { localStorage.setItem(UPDATE_KEY, JSON.stringify({ at: upd.at, latest })); } catch (e) {}
  } else {
    upd.error = error || "確認できませんでした";
  }
  renderUpdateUi();
}
function onUpdateState(s, detail) { upd.state = s; upd.detail = detail; renderUpdateUi(); }

function renderUpdateUi() {
  // 一覧の上のお知らせ帯
  const bar = $("updateBar");
  if (hasUpdate()) {
    bar.replaceChildren();
    bar.append(el("span", null, "新しいバージョン "));
    bar.append(el("b", "num", `v${upd.latest.versionName}`));
    bar.append(el("span", null, " があります"));
    bar.append(el("span", "go", "更新 ›"));
    bar.classList.remove("hidden");
  } else bar.classList.add("hidden");
  $("prefsDot").classList.toggle("hidden", !hasUpdate());
  if (state.screen === "prefs") renderPrefs();
  if (state.screen === "about") renderAbout();
}

function fmtAt(iso) { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

function showAbout() {
  closeMenu();
  showScreen("about");
  renderAbout();
  // 開いたら確認する（直前に確認していれば省く）
  if (!upd.checking && (!upd.at || Date.now() - new Date(upd.at) > 60 * 1000)) checkUpdate();
}

function renderAbout() {
  const body = $("detailBody"); body.replaceChildren();
  const head = el("div", "about-head");
  const logo = el("div", "logo");
  logo.innerHTML = '<svg viewBox="0 0 108 108" width="52" height="52"><path fill="none" stroke="#F2E6C9" stroke-width="9" stroke-linecap="round" d="M38,74 L38,52 A16,16 0 0 1 70,52 L70,74"/></svg>';
  const t = el("div"); t.append(el("h2", null, "地方競馬データ収集"));
  t.append(el("p", "num", `v${current.versionName}`));
  head.append(logo, t); body.append(head);

  // 更新の状態
  const card = el("div", "card");
  const st = el("div", "status");
  if (upd.checking) { st.classList.add("run"); st.append(el("span", "ic"), el("span", null, "最新版を確認しています…")); }
  else if (upd.error && !upd.latest) { st.classList.add("ng"); st.append(el("span", "ic", "×"), el("span", null, "確認できませんでした")); }
  else if (hasUpdate()) { st.classList.add("new"); st.append(el("span", "ic", "↑"), el("span", null, `新しいバージョン v${upd.latest.versionName} があります`)); }
  else if (upd.latest) { st.classList.add("ok"); st.append(el("span", "ic", "✓"), el("span", null, "最新版です")); }
  card.append(st);
  if (upd.error) card.append(el("p", "note", `理由：${upd.error}。通信状態を確認して、もう一度確認してください`));
  if (upd.at && !upd.checking) card.append(el("p", "note", `確認 ${fmtAt(upd.at)}`));

  if (hasUpdate()) {
    const btn = el("button", "btn primary");
    btn.style.width = "100%"; btn.style.marginTop = "12px";
    const s = upd.state;
    if (s === "download") {
      btn.disabled = true; btn.textContent = `ダウンロード中… ${upd.detail}%`;
      card.append(btn);
      const bar = el("div", "bar"); const f = el("i"); f.style.width = `${upd.detail}%`; bar.append(f); card.append(bar);
    } else {
      btn.textContent = s === "install" ? "インストール画面をもう一度開く" : "更新する（ダウンロードしてインストール）";
      btn.onclick = () => Native.installUpdate(upd.latest.versionName);

  // 買い目の一覧（key: "買い目" か "的中買い目"）
  function betSection(key, oddsKey, title, condText, evMin) {
  const c = el("div", "bet-section");
  if (title) { const hh = el("h4", "bet-head", title); hh.append(el("span", "aside", condText)); c.append(hh); }
  else c.append(el("p", "ai-cond", condText));
  const bets = ai[key] || [];
  const settled = rec["結果"] ? KS.settleBets(rec, key) : null;
  // 記録したときのオッズと、今のオッズ（記録のあとに取り直していれば）
  const recOdds = ai[oddsKey] || [];
  if (!bets.length) c.append(el("p", "ai-skip", "見送り（条件を満たす買い目なし）"));
  else {
    const list = el("div", "bet-list");
    let total = 0;
    bets.forEach((b, i) => {
      total += b["金額"];
      const s = settled && settled[i];
      const row = el("div", "bet");
      // 1行目：券種・組み合わせ（馬名）・金額・結果
      const top = el("div", "bet-top");
      const names = b["券種"].startsWith("枠") ? "" : b["組み合わせ"].split("-").map((n) => ((info.horses || []).find((x) => String(parseInt(x.no, 10)) === n) || {}).name || "").filter(Boolean).join("・");
      const what = el("span", "bet-what");
      what.append(el("b", null, `${b["券種"]} ${b["組み合わせ"]}`));
      if (names && b["組み合わせ"].split("-").length === 1) what.append(el("span", "bet-name", names));
      top.append(what, el("span", "bet-amt num", yen(b["金額"])));
      if (rec["結果"]) {
        top.append(el("span", "bet-res " + (s ? (s["判定"] === "的中" ? "hit" : s["判定"] === "返還" ? "back" : "miss") : "miss"),
          s ? (s["判定"] === "的中" ? `的中 ${yen(s["払戻"])}` : s["判定"] === "返還" ? `返還 ${yen(s["払戻"])}` : "不的中") : "払戻不明"));
      }
      row.append(top);
      if (names && b["組み合わせ"].split("-").length > 1) row.append(el("div", "bet-names", names));
      // 2行目：オッズ × AI の的中率 ＝ 期待値、当たれば
      const atRec = recOdds[i] ? { text: recOdds[i], low: parseFloat(/\d+(\.\d+)?/.exec(recOdds[i]) || "") } :
        (b["券種"] === "単勝" && rec["馬"] && rec["馬"][b["組み合わせ"]] ? { text: rec["馬"][b["組み合わせ"]]["単勝"], low: parseFloat(rec["馬"][b["組み合わせ"]]["単勝"]) } :
        (!updated ? betOddsOf(b, info) : null));
      const now = updated ? betOddsOf(b, info) : null;
      const p = betProbOf(b, pred);
      const wide = /\d\s*-\s*\d/.test(atRec ? atRec.text : "");
      const line = (o, label) => {
        const d = el("div", "bet-ev");
        if (!o || !(o.low > 0)) { d.append(el("span", null, `${label}オッズ不明` + (p != null ? `　当たる確率 ${(p * 100).toFixed(1)}%` : ""))); return d; }
        d.append(el("span", null, `${label}${o.text}倍`));
        if (p != null) {
          const ev = p * o.low;
          d.append(el("span", null, `　×　当たる確率 ${(p * 100).toFixed(1)}%　＝　`), el("b", Math.round(ev * 100) / 100 >= evMin - 1e-9 ? "ev-ok" : "ev-ng", `期待値 ${ev.toFixed(2)}`));
        }
        return d;
      };
      const odds1 = line(atRec && atRec.low > 0 ? atRec : null, rec["予想オッズ"] && b["券種"] === "単勝" ? "記録時（予想オッズ） " : "記録時 ");
      if (atRec && atRec.low > 0) odds1.append(el("span", "bet-pay", `当たれば ${yen(Math.floor(b["金額"] / 100) * Math.round(atRec.low * 100))}${wide ? "以上" : ""}`));
      row.append(odds1);
      if (now && (!atRec || !(atRec.low > 0) || now.text !== atRec.text)) row.append(line(now, "今 "));
      list.append(row);
    });
    c.append(list);
    const sum = el("p", "bet-total");
    sum.append(document.createTextNode(`合計 ${yen(total)}`));
    // どれかが当たる確率（AI の見積もり）。同じ券種の別の組み合わせ（単勝どうし・三連複どうしなど）は同時に当たらないので足せる。
    // 複勝・ワイドや券種が混ざると同時に当たることがあるので、幅（いちばん高い確率〜足した確率）で出す
    const ps = bets.map((b) => betProbOf(b, pred));
    if (ps.length && ps.every((x) => x != null)) {
      const exclusive = new Set(bets.map((b) => b["券種"])).size === 1 && !["複勝", "ワイド"].includes(bets[0]["券種"]) &&
        new Set(bets.map((b) => b["組み合わせ"])).size === bets.length;
      const total1 = Math.min(1, ps.reduce((t, x) => t + x, 0)), max1 = Math.max(...ps);
      const pct = (x) => `${(x * 100).toFixed(1)}%`;
      const range = !(exclusive || total1 - max1 < 0.0005);
      sum.append(el("span", "hit-any", range ? `どれかが当たる確率 ${pct(max1)}〜${pct(total1)}` : `どれかが当たる確率 ${pct(total1)}`));
      if (range) sum.append(el("span", "note", "複勝・ワイドや券種の違う買い目は同時に当たることがあるので、幅で出しています（AI の見積もり）"));
    }
    if (bets.some((b) => betProbOf(b, pred) == null)) sum.append(el("span", "note", "推定的中率が分からない買い目は、期待値を出していません（記録用ブロックに推定的中率の列が無い古い回答など）"));
    c.append(sum);
    if (settled) {
      const spent = settled.reduce((t, x) => t + x["金額"], 0), ret = settled.reduce((t, x) => t + x["払戻"], 0);
      const v = el("p", "verdict"); v.append(document.createTextNode("収支 "), el("b", ret - spent >= 0 ? "up" : "down", `${ret - spent >= 0 ? "+" : ""}${yen(ret - spent)}`), document.createTextNode(`（購入 ${yen(spent)} → 払戻 ${yen(ret)}）`));
      c.append(v);
    }
  }
  return c;
  }

  if (ai["総評"]) c.append(el("p", "ai-comment", `「${ai["総評"]}」`));

  if (rec["結果"]) {
    const top = Object.entries(rec["結果"]["着順"]).filter(([, r]) => /^[123]$/.test(r)).sort((a, b) => +a[1] - +b[1]).map(([n, r]) => `${r}着 ${n}番`).join("・");
    c.append(el("p", "note", `結果：${top}`));
  } else {
    const ss = sinceStart(rec);
    if (ss != null && ss >= 15 && rec.race_id) {
      const b = el("button", "btn secondary preview-btn", "結果を取得して答え合わせ"); b.onclick = () => fetchResults([key]); c.append(b);
    } else {
      let exact = true; try { exact = Native.exactAlarmAllowed(); } catch (e) {}
      const at = resultTimeOf(rec);
      c.append(el("p", "note", !at ? "発走の15分後から結果を取得できます"
        : exact ? `結果は ${at} ごろ自動で取得して通知します`
        : `結果は ${at} から取得できます（自動で取るには「アラームとリマインダー」の許可が要ります）`));
    }
  }

  // 市場と AI の比較（AI の推定勝率の高い順に6頭。買った馬は必ず入れる）
  const boughtNos = new Set();
  for (const b of [...(ai["買い目"] || []), ...(ai["的中買い目"] || [])]) if (!b["券種"].startsWith("枠")) b["組み合わせ"].split("-").forEach((n) => boughtNos.add(n));
  const horses = (info.horses || []).filter((x) => !x.cancel);
  const all = horses.map((x) => ({ x, no: String(parseInt(x.no, 10)), ai: pred[String(parseInt(x.no, 10))] })).filter((r) => r.ai)
    .sort((a, b) => b.ai["勝率"] - a.ai["勝率"]);
  const rows = all.filter((r, i) => i < 6 || boughtNos.has(r.no));
  if (rows.length) {
    const tb = el("table", "rec-table"); tb.style.marginTop = "12px";
    const hr = el("tr"); for (const [t, cls] of [["馬"], ["市場", "r"], ["AI勝率", "r"], ["差", "r"], ["AI複勝", "r"]]) hr.append(el("th", cls || null, t)); tb.append(hr);
    for (const { x, no, ai: a } of rows) {
      const d = a["勝率"] - (x.prob || 0);
      const ratio = x.prob ? a["勝率"] / x.prob : null;
      const tag = ratio != null && d >= 2 && ratio >= 1.3 ? ["pick", "狙い目"] : ratio != null && d <= -2 && ratio <= 0.9 ? ["over", "人気しすぎ"] : null;
      const tr = el("tr");
      if (boughtNos.has(no)) tr.className = "bought";
      const res = rec["結果"] && rec["結果"]["着順"][no];
      const name = el("td");
      if (boughtNos.has(no)) name.append(el("span", "buy-mark", "買"));
      name.append(document.createTextNode(`${x.no} ${x.name}${res && /^\d+$/.test(res) ? `（${res}着）` : ""}`));
      if (tag) name.append(el("span", "h-tag " + tag[0], tag[1]));
      tr.append(name, el("td", "r", x.prob != null ? `${x.prob.toFixed(1)}%` : "--"),
        el("td", "r", `${a["勝率"].toFixed(1)}%`), el("td", "r", `${d >= 0 ? "+" : ""}${d.toFixed(1)}`), el("td", "r", `${a["複勝率"].toFixed(0)}%`));
      tb.append(tr);
    }
    c.append(tb);
    c.append(el("p", "note", (updated ? `市場は最新の収集（${state.result.res.at.slice(11, 16)}）の値。` : "") + "AI の推定勝率の高い順に6頭（買った馬は必ず表示）。差は AI − 市場（ポイント）。AI が市場より2ポイント以上・3割以上高く見る馬に「狙い目」、2ポイント以上・1割以上低く見る馬に「人気しすぎ」"));
  }
  const row = el("div", "btn-row"); row.style.marginTop = "10px";
  const again = el("button", "btn quiet", "貼り直す"); again.onclick = pasteAiAnswer;
  const del = el("button", "btn quiet", "記録を消す");
  del.onclick = () => {
    if (!del.dataset.armed) { del.dataset.armed = "1"; del.textContent = "もう一度押すと消します"; return; }
    const r = readRecords();
    if (ownBetsOf(r[key]).length) {
      // 買った馬券は残し、AI の回答だけ消す
      r[key]["AI"] = null; delete r[key]["買い方"]; writeRecords(r); scheduleResultCheck(key, r[key], race);
    } else { delete r[key]; writeRecords(r); try { Native.cancelResultCheck(key); } catch (e) {} }
    renderResult(); updateRecBadge(); toast("AI の予想の記録を消しました");
  };
  row.append(again, del); c.append(row);
  return c;
}

// ===== 買った馬券（自分で実際に買ったもの。AI の買い目とは別に記録して答え合わせする） =====
function ownBetsOf(r) { return r && Array.isArray(r["購入"]) ? r["購入"] : []; }
// 買った馬券を保存する（記録が無ければ、収集したデータから記録を作る）
function saveOwnBets(venue, race, list) {

    if (res.info.predicted) rec["予想オッズ"] = true;

// 1点ずつ入れるシート（券種・馬番・金額）
function openOwnSheet(venue, race) {
  const info = state.result.res.info;
  const horses = (info.horses || []).filter((x) => !x.cancel);
  const TYPES = ["単勝", "複勝", "ワイド", "馬連", "馬単", "3連複", "3連単", "枠連", "枠単"];
  let type = "単勝", picks = [], amount = 100;
  const sh = $("sheet");
  function render() {
    sh.replaceChildren();
    sh.append(el("div", "grip"), el("h3", null, "買った馬券を入れる"), el("p", "sub", `${venue} ${race.no}R ${race.title || ""}`));
    sh.append(el("h4", null, "券種"));
    const tg = el("div", "chips-pick");
    for (const t of TYPES) { const b = el("button", null, t); b.setAttribute("aria-pressed", String(t === type)); b.onclick = () => { type = t; picks = []; render(); }; tg.append(b); }
    sh.append(tg);
    const [need, ordered] = KS.BET_SPECS[type];
    const waku = type.startsWith("枠");
    sh.append(el("h4", null, `${waku ? "枠番" : "馬番"}（${need}${waku ? "枠" : "頭"}${ordered ? "。着順の順に選ぶ" : ""}）`));
    const grid = el("div", "pick-grid");
    const items = waku ? [...new Set(horses.map((x) => x.waku).filter(Boolean))].sort((a, b) => a - b).map((w) => ({ no: String(+w), name: "" }))
      : horses.map((x) => ({ no: String(parseInt(x.no, 10)), name: x.name }));
    for (const it of items) {
      const idx = picks.indexOf(it.no);
      const b = el("button", "pick" + (idx >= 0 ? " on" : ""));
      b.append(el("b", null, it.no)); if (it.name) b.append(el("small", null, it.name));
      if (idx >= 0 && ordered) b.append(el("i", null, `${idx + 1}着`));
      b.onclick = () => { if (idx >= 0) picks.splice(idx, 1); else if (picks.length < need) picks.push(it.no); render(); };
      grid.append(b);
    }
    sh.append(grid);
    sh.append(el("h4", null, "金額"));
    const st = stepper(yen(amount), amount <= 100, amount >= 100000, () => { amount = Math.max(100, amount - 100); render(); }, () => { amount += 100; render(); });
    sh.append(st);
    const ag = el("div", "chips-pick");
    for (const v of [100, 200, 300, 500, 1000, 2000]) { const b = el("button", null, yen(v)); b.setAttribute("aria-pressed", String(v === amount)); b.onclick = () => { amount = v; render(); }; ag.append(b); }
    sh.append(ag);
    const act = el("div", "end-actions");
    const ok = el("button", "btn primary", picks.length === need ? `${type} ${KS.comboKey(type, picks)}・${yen(amount)} を入れる` : `${need - picks.length}つ選んでください`);
    ok.disabled = picks.length !== need;
    ok.onclick = () => {
      const recs = readRecords(); const cur = ownBetsOf(recs[cacheKey(state.date, venue, race.no)]);
      saveOwnBets(venue, race, cur.concat([{ "券種": type, "組み合わせ": KS.comboKey(type, picks), "金額": amount }]));
      closeSheet(); toast("入れました");
    };
    const cancel = el("button", "btn quiet", "やめる"); cancel.onclick = closeSheet;
    act.append(ok, cancel); sh.append(act);
  }
  render();
  sh.classList.remove("hidden"); $("sheetScrim").classList.remove("hidden");
}

const BET_KEY = "keiba-bet-settings";
const BET_LIMITS = { budget: [100, 100000, 100], max_bets: [1, 10, 1], ev_min: [1.0, 3.0, 0.05], hit_min: [10, 80, 5], hit_ev_min: [0.5, 1.5, 0.05] };
function betSettings() {
  const d = (window.KS && KS.DEFAULT_SETTINGS) || { budget: 1000, max_bets: 3, ev_min: 1.2, mode: "both", hit_min: 30, hit_ev_min: 0.9 };
  const v = Object.assign({}, d, store.get(BET_KEY, {}));
  const clamp = (k) => { const [lo, hi] = BET_LIMITS[k]; v[k] = Math.min(hi, Math.max(lo, Number(v[k]) || d[k])); };
  ["budget", "max_bets", "ev_min", "hit_min", "hit_ev_min"].forEach(clamp);
  v.ev_min = Math.round(v.ev_min * 100) / 100;
  v.hit_ev_min = Math.round(v.hit_ev_min * 100) / 100;
  if (!["ev", "hit", "both"].includes(v.mode)) v.mode = d.mode;
  // 1点100円なので、点数は予算で買える数まで
  v.max_bets = Math.min(v.max_bets, Math.floor(v.budget / 100));
  return v;
}

  if (!window.KS) return res.text;
  let t = KS.withSettings(res.text, Object.assign({}, betSettings(), { template: promptTemplate() }));
  if (res.diff) {

    if (i >= 0) t = t.slice(0, i) + block + "\n\n" + t.slice(i);
